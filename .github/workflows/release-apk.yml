name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag / version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore from repo template
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare release signing keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=production" >> "$GITHUB_ENV"
          else
            EPHEMERAL_PASS="onionshield-ci-release"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$EPHEMERAL_PASS" \
              -alias upload \
              -keypass "$EPHEMERAL_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=OnionShield CI, O=OnionShield, C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=ephemeral" >> "$GITHUB_ENV"
          fi

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build signed Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Package APK & SHA-256 checksum
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          fi
          mkdir -p release-assets
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "Release APK not found!" >&2
            exit 1
          fi
          OUT_APK="release-assets/OnionShield-${TAG_NAME}-release.apk"
          cp "$RAW_APK" "$OUT_APK"
          sha256sum "$OUT_APK" > "${OUT_APK}.sha256"
          echo "RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"
          echo "APK_PATH=$OUT_APK" >> "$GITHUB_ENV"
          echo "SHA_PATH=${OUT_APK}.sha256" >> "$GITHUB_ENV"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnionShield-${{ env.RELEASE_TAG }}-apk
          path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OnionShield ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            ### OnionShield Android APK (${{ env.RELEASE_TAG }})

            - **Signing Mode:** `${{ env.SIGNING_MODE }}`
            - **Minimum Android SDK:** API 24 (Android 7.0+)
            - **Included Security Defaults:** No-Script (JS disabled by default), HTTPS Everywhere, WebRTC Leak Protection, Tor SOCKS5 Proxy (`127.0.0.1:9050`), Tracker Blocker, Fingerprint Randomization.

            > **Note:** If `SIGNING_MODE` is `ephemeral`, configure `RELEASE_KEYSTORE_BASE64`, `STORE_PASSWORD`, and `KEY_PASSWORD` in GitHub Repository Secrets for consistent signing across app updates.
          files: |
            ${{ env.APK_PATH }}
            ${{ env.SHA_PATH }}
